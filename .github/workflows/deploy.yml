name: Build and deploy to Cloudflare

on:
  push:
    branches: [main, fix-email-auth-e2e-20260924]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Validate and build LTCme
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://sddeayzumvkdmdgqetyz.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate auth build configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "Missing GitHub secret VITE_SUPABASE_PUBLISHABLE_KEY (or SUPABASE_PUBLISHABLE_KEY)."
            exit 1
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
